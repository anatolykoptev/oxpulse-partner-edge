schema_version: 1
tenants:
  - id: edge-a
    domains:
      - edge-a.example
      - www.edge-a.example
    enabled: true
    routes:
      - path: /api/landing-chat*
        action: proxy
        upstream: https://webhooks.edge-a.edge-c.example
        host_header: webhooks.edge-a.edge-c.example
        sse: true
      - path: /static/*
        action: file_server
        root: /srv/edge-a-static
        cache_control: "public, max-age=86400"
        strip_path_prefix: /static
      - path: /favicon.ico
        action: file_server
        root: /srv/edge-a-static
        try_files:
          - /favicon.ico
      - path: /
        action: file_server
        root: /srv/edge-a-landing
        try_files:
          - "{path}"
          - /index.html
        cache_control: "public, max-age=300"
    security_headers: edge_a_default
    redirects:
      - from_host: www.edge-a.example
        to: "https://edge-a.example{uri}"
        permanent: true
