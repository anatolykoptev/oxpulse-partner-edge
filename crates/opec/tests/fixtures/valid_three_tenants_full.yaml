# Full fixture: one of each route action type + redirect, three tenants.
# Used by caddy renderer tests in sub-phase 4.1.
schema_version: 1
tenants:
  - id: edge-a
    domains:
      - edge-a.example
      - www.edge-a.example
    enabled: true
    routes:
      - path: /api/landing-chat*
        action: proxy
        upstream: https://webhooks.edge-a.edge-c.example
        host_header: webhooks.edge-a.edge-c.example
        sse: true
      - path: /static/*
        action: file_server
        root: /srv/edge-a-static
        cache_control: "public, max-age=86400"
        strip_path_prefix: /static
      - path: /favicon.ico
        action: file_server
        root: /srv/edge-a-static
        try_files:
          - /favicon.ico
      - path: /
        action: file_server
        root: /srv/edge-a-landing
        try_files:
          - "{path}"
          - /index.html
        cache_control: "public, max-age=300"
    redirects:
      - from_host: www.edge-a.example
        to: "https://edge-a.example{uri}"
        permanent: true

  - id: alpha-bot
    domains:
      - alpha.example.com
    enabled: true
    routes:
      - path: /api/*
        action: proxy
        upstream: http://api.alpha.internal
        host_header: api.alpha.internal
      - path: /
        action: file_server
        root: /srv/alpha-bot
        try_files:
          - "{path}"
          - /index.html

  - id: gamma-static
    domains:
      - gamma.example.org
    enabled: false
    routes:
      - path: /
        action: file_server
        root: /srv/gamma-static
        cache_control: "public, max-age=3600"
    redirects:
      - from_host: www.gamma.example.org
        to: "https://gamma.example.org{uri}"
        permanent: false
