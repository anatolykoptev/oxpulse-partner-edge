[package]
name = "opec"
version = "0.1.0"
edition = "2021"
description = "OxPulse Partner Edge Controller — tenant control plane (sub-phase 4.0)"

[lib]
name = "opec"
path = "src/lib.rs"

[[bin]]
name = "opec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1"
regex = "1"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
