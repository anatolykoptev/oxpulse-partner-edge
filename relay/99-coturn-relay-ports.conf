# Origin: krolik-server deploy/host-config/sysctl/99-coturn-relay-ports.conf,
# range widened to the relay-node range. Keep in sync with min-port/max-port in
# coturn-relay.conf.tpl and the guard in coturn-self-relay-guard.nft.
#
# Keeps coturn's relay range out of the kernel's ephemeral pool, so "a local UDP
# socket inside this range" means "a coturn relay" and nothing else. An explicit
# bind() to a reserved port still succeeds, which is how coturn takes its ports.
net.ipv4.ip_local_reserved_ports = 49152-65535
