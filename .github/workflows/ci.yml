name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
        working-directory: crates/sfu
      - run: cargo clippy --workspace -- -D warnings
        working-directory: crates/sfu

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        working-directory: crates/sfu

  fips-build:
    name: FIPS build check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install FIPS build deps
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo check (FIPS)
        run: cargo check --workspace --features fips
        working-directory: crates/sfu
