name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs-gate: canonical docs-only detector. Inserted by scripts/docs-gate.rb; the
  # `check` mode compares this block byte for byte, so edit it HERE, never per repo.
  # Spec and failure semantics: ~/.claude/skills/ci-setup/specs/docs-only-fastpath.md
  # A doc is a doc only if no code reads it: a changed `.md`/`docs/` path that a non-doc
  # tracked file names (test, embed, build script) is reclassified as code, and the job log
  # says which file referenced it. Glob/dir reads the scan cannot see: --not-doc / --skip-job.
  docs-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
        run: |
          # docs_only=true only on a positive, complete answer; every doubt means full CI.
          is_doc() {
            case "$1" in
              *.md | docs/* | doc/* | LICENSE | LICENSE.* | LICENSE-* | COPYING | NOTICE | AUTHORS) return 0 ;;
              .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE* | .github/CODEOWNERS) return 0 ;;
            esac
            return 1
          }
          why=
          touched() { # every touched path (rename sources included); non-zero on any doubt
            local url page=1 resp n
            case "$EVENT" in
              pull_request) url="$API/repos/$REPO/pulls/$PR/files" ;;
              push)
                [ -n "${BEFORE//0/}" ] || { why="push without a usable before sha"; return 1; }
                url="$API/repos/$REPO/compare/$BEFORE...$AFTER" ;;
              *) why="event $EVENT"; return 1 ;;
            esac
            while :; do
              resp=$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" | curl -fsS --retry 2 -K - -H "Accept: application/vnd.github+json" "$url?per_page=100&page=$page") || { why="API error on page $page"; return 1; }
              if [ "$EVENT" = push ] && [ "$page" = 1 ]; then
                [ "$(jq -r .status <<<"$resp")" = ahead ] || { why="push is not a fast-forward"; return 1; }
              fi
              n=$(jq -r '(if type == "array" then . else .files end) | length' <<<"$resp") || { why="unreadable page $page"; return 1; }
              [[ $n =~ ^[0-9]+$ ]] || { why="unreadable page $page"; return 1; }
              jq -r '(if type == "array" then . else .files end) | .[] | .filename, (.previous_filename // empty)' <<<"$resp" || { why="unreadable page $page"; return 1; }
              # compare lists at most 300 files: 300 or more may be a truncated list
              if [ "$EVENT" = push ] && [ "$n" -ge 100 ]; then why="push may exceed the compare file cap"; [ "$page" -lt 3 ] || return 1; fi
              [ "$n" -ge 100 ] || { why=; return 0; }
              page=$((page + 1))
              [ "$page" -le 30 ] || { why="3000 files or more"; return 1; }
            done
          }
          # --- reference-aware pass: a doc that code reads is code ----------------------------
          scratch=
          cleanup() { if [ -n "$scratch" ] && [ -d "$scratch" ]; then rm -rf -- "$scratch"; fi; return 0; }
          trap cleanup EXIT
          # packaging manifests name README/CHANGELOG to ship it, not to read it
          pkg_manifest() {
            case "${1##*/}" in
              Cargo.toml | Cargo.lock | package.json | package-lock.json | pnpm-lock.yaml | pyproject.toml | setup.py | setup.cfg | MANIFEST.in | composer.json | *.gemspec | Dockerfile* | .goreleaser.y*ml | release-please-config.json) return 0 ;;
            esac
            return 1
          }
          community_file() {
            case "$1" in
              README | README.* | CHANGELOG | CHANGELOG.* | CHANGES | CHANGES.* | CONTRIBUTING | CONTRIBUTING.* | CODE_OF_CONDUCT | CODE_OF_CONDUCT.* | SECURITY | SECURITY.* | LICENSE | LICENSE.* | LICENCE | LICENCE.* | COPYING | NOTICE | AUTHORS) return 0 ;;
            esac
            return 1
          }
          ref_tree() { # shallow copy of the tree CI would test (the PR merge ref) in $scratch; non-zero on any doubt
            local rev tw=
            case "$EVENT" in
              pull_request) rev="refs/pull/$PR/merge" ;;
              *) rev="$AFTER" ;;
            esac
            command -v timeout >/dev/null 2>&1 && tw="timeout 120"
            scratch=$(mktemp -d) || { why="no scratch dir"; return 1; }
            git -C "$scratch" init -q || { why="git init failed"; return 1; }
            # the token travels in the environment, never argv (/proc/<pid>/cmdline is world-readable)
            GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$SERVER/.extraheader" \
              GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
              $tw git -C "$scratch" fetch -q --depth=1 --no-tags "$SERVER/$REPO.git" "$rev" || { why="tree fetch failed ($rev)"; return 1; }
          }
          # ignore lists name files to leave out, never to read
          ignore_file() {
            case "${1##*/}" in .gitignore | .dockerignore | .npmignore | .prettierignore | .eslintignore | .gitattributes | .gitleaksignore | .markdownlintignore) return 0 ;; esac
            return 1
          }
          # third-party trees carry their own README/LICENSE/CHANGELOG mentions; they never read ours
          vendored() {
            case "$1" in
              vendor/* | */vendor/* | node_modules/* | */node_modules/* | third_party/* | */third_party/*) return 0 ;;
            esac
            return 1
          }
          # Does file $1 carry $2 on a line that is code? A comment line ("// see CLAUDE.md") names
          # a doc without reading it; directives that read ARE live (//go:embed, #[doc = include_str!]).
          # An occurrence inside a URL (https://host/blob/main/README.md) is a link, not a read.
          live_mention() {
            git -C "$scratch" cat-file blob "FETCH_HEAD:$1" 2>/dev/null | LC_ALL=C awk -v n="$2" '
              { s = $0; off = 0
                while ((i = index(s, n)) > 0) {
                  pre = substr($0, 1, off + i - 1); sub(/[A-Za-z0-9_@+.\/:~%-]*$/, "", pre)
                  tok = substr($0, length(pre) + 1, off + i - 1 - length(pre))
                  if (tok !~ /:\/\//) { l = $0; sub(/^[ \t]+/, "", l)
                    # a flag line (`--config docs/x.md`) is code; only `-- ` / `--` alone is an SQL comment
                    if (l ~ /^(\/\/go:|#\[|#!|#include|#embed|#import)/ || l !~ /^(\/\/|#|\* |\*\/|\*$|\/\*|-- |--$|<!--)/) { found = 1; exit } }
                  off += i + length(n) - 1; s = substr(s, i + length(n)) } }
              END { exit !found }'
          }
          # Does a non-doc tracked file read any of the candidate docs? 0 = no, 1 = yes (why says
          # which), 2 = the scan itself failed. Any non-zero means full CI.
          ref_scan() {
            local pats="$scratch/pats" f b hits line src m t bn dir stem p rc=0 start=$SECONDS
            declare -A seen
            : > "$pats"
            for f in "$@"; do
              b=${f##*/}
              # LICENSE, NOTICE, COPYING are English words and nothing reads them: not scanned
              case "$b" in *.*) printf '%s\n%s\n' "$f" "$b" >> "$pats" ;; esac
            done
            [ -s "$pats" ] || return 0
            # (1) literal: the full path or the basename as a whole word. The basename is what
            # filepath.Join(root, "docs", "x.md") and read('DESIGN.md') leave in the source.
            hits=$(git -C "$scratch" grep -I -w -F -o -f "$pats" FETCH_HEAD) || rc=$?
            [ "$rc" -le 1 ] || { why="reference scan failed (git grep rc $rc)"; return 2; }
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line=${line#FETCH_HEAD:}; src=${line%%:*}; m=${line#*:}
              [ -z "${seen[$src|$m]:-}" ] || continue
              seen[$src|$m]=1
              [ $((SECONDS - start)) -lt 90 ] || { why="reference scan exceeded 90s"; return 2; }
              is_doc "$src" && continue
              vendored "$src" && continue
              ignore_file "$src" && continue
              pkg_manifest "$src" && community_file "${m##*/}" && continue
              live_mention "$src" "$m" || continue
              why="$m treated as code: referenced by $src"
              return 1
            done <<<"$hits"
            # (2) glob: embed/glob patterns with a literal stem (skills/d10-*.md) or a literal
            # directory (skills/*.md). Bare `*.md` / `**/*.md` come from ignore files, linters and
            # --include flags and would make every doc code: ignored, covered by --not-doc.
            rc=0
            hits=$(git -C "$scratch" grep -I -o -E -e '[A-Za-z0-9_@+./*?-]*[*?][A-Za-z0-9_@+./*?-]*[.]mdx?' FETCH_HEAD) || rc=$?
            [ "$rc" -le 1 ] || { why="glob scan failed (git grep rc $rc)"; return 2; }
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line=${line#FETCH_HEAD:}; src=${line%%:*}; t=${line#*:}
              [ -z "${seen[$src|$t]:-}" ] || continue
              seen[$src|$t]=1
              is_doc "$src" && continue
              vendored "$src" && continue
              bn=${t##*/}; dir=
              case "$t" in */*) dir=${t%/*} ;; esac
              stem=${bn//[*?]/}; stem=${stem%.mdx}; stem=${stem%.md}
              if [ -z "$stem" ]; then
                case "$dir" in "" | *[*?]*) continue ;; esac
              fi
              for p in "$@"; do
                case "$p" in
                  $t | */$t)
                    live_mention "$src" "$t" || break
                    why="$t treated as code: glob in $src matches $p"
                    return 1 ;;
                esac
              done
              [ $((SECONDS - start)) -lt 90 ] || { why="reference scan exceeded 90s"; return 2; }
            done <<<"$hits"
            return 0
          }
          docs_only=false
          cands=()
          # `if !` keeps errexit off for the whole listing: every doubt is an explicit return 1
          if ! list=$(touched); then
            why=${why:-listing failed}
          elif [ -z "$list" ]; then
            why="no changed paths"
          else
            docs_only=true
            while IFS= read -r f; do
              if is_doc "$f"; then cands+=("$f"); else docs_only=false; why="code path: $f"; break; fi
            done <<<"$list"
            if [ "$docs_only" = true ]; then
              rc=0
              if ! ref_tree; then
                docs_only=false; why=${why:-tree fetch failed}
              else
                ref_scan "${cands[@]}" || rc=$?
                [ "$rc" -eq 0 ] || { docs_only=false; why=${why:-reference scan failed}; }
              fi
              [ "$docs_only" != true ] || why="${#cands[@]} doc paths, none read by code"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only${why:+ ($why)}" | tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
        working-directory: crates/sfu
      - run: cargo clippy --workspace -- -D warnings
        working-directory: crates/sfu
      # Same featureless blind spot as the `test` job: clippy --workspace never
      # lints the required-features=["test-utils"] test files either.
      - run: cargo clippy -p oxpulse-sfu --features test-utils,vfm --all-targets -- -D warnings
        working-directory: crates/sfu

  # ADR-S10 — single-str0m fitness. Both oxpulse-sfu-kit and this crate MUST
  # resolve to ONE str0m version; two mismatched 0.x minors are a hard compile
  # break at every interop boundary (SfuRid/Rid, MediaData). Fails if the
  # workspace resolves more than one str0m version.
  single-str0m:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    name: Single str0m version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert exactly one str0m version
        run: |
          set -euo pipefail
          count=$(cargo tree --workspace --prefix none -i str0m 2>/dev/null | grep -c '^str0m v' || true)
          echo "resolved str0m versions: $count"
          cargo tree --workspace -i str0m || true
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly 1 str0m version, found $count (two minors are a hard interop break)"
            exit 1
          fi

  # ADR-S8 — release-train guardrail. A validation-only [patch.crates-io]
  # override that points oxpulse-sfu-kit at a git/path source MUST NEVER reach a
  # deployable branch. Runs only for main/dev (push or PR target); a scratch
  # validation branch is intentionally exempt.
  no-kit-source-override:
    name: No oxpulse-sfu-kit source override
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev' ||
      github.base_ref == 'main' ||
      github.base_ref == 'dev'
    steps:
      - uses: actions/checkout@v4
      - name: Reject git=/path= override on oxpulse-sfu-kit
        run: |
          set -euo pipefail
          # Match a [patch...] entry pinning oxpulse-sfu-kit to a git or path source.
          if grep -Eiq 'oxpulse-sfu-kit[[:space:]]*=.*(\bgit\b|\bpath\b)[[:space:]]*=' Cargo.toml; then
            echo "::error::Cargo.toml carries a git=/path= override on oxpulse-sfu-kit."
            echo "This validation-only [patch.crates-io] must never land on main/dev."
            grep -niE 'oxpulse-sfu-kit[[:space:]]*=.*(git|path)[[:space:]]*=' Cargo.toml || true
            exit 1
          fi
          echo "OK: no oxpulse-sfu-kit source override present."

  test:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        working-directory: crates/sfu
      # `cargo test --workspace` above is featureless, so every test with
      # `required-features = ["test-utils"]` (most of crates/sfu/tests/*.rs —
      # see each [[test]] entry in Cargo.toml) is silently skipped, not run.
      # That let several of them bit-rot uncompiled (fixed in the sfu test
      # hygiene pass). Compile + run them explicitly so this can't recur.
      - run: cargo test -p oxpulse-sfu --features test-utils,vfm
        working-directory: crates/sfu

  fips-build:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    name: FIPS build check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install FIPS build deps
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo check (FIPS)
        run: cargo check --workspace --features fips
        working-directory: crates/sfu

  installer-bash-tests:
    name: Installer bash tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      # Tests use REPO_ROOT to locate install.sh / upgrade.sh / templates.
      # Without this, tests fall back to the developer's local path and fail.
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      # Both steps call scripts/run-shell-tests.sh so that `make check-sh`
      # locally and this job enumerate the SAME set. The enumeration used to
      # live here inline, which meant there was no way to run what CI runs
      # without pushing — see the script's header for the cost that carried.
      # Skip lists and their reasons live in the script, not in this YAML.
      - name: Run plain-bash tests
        run: scripts/run-shell-tests.sh --plain

      - name: Run bats tests
        run: scripts/run-shell-tests.sh --bats

  # Relay-only nodes run a static musl coturn (relay/coturn-static). Build it and
  # run the real turnserver with the real relay template, rendered by the real
  # `opec render coturn`: starts clean, allocates, refuses the denied peers.
  # tests/test_relay_coturn_smoke.sh SKIPs in the installer job (no binaries); this
  # job is where it actually runs on every PR.
  relay-coturn-static:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    name: Relay static coturn smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "relay-opec"
      - uses: docker/setup-buildx-action@v3
      - name: Build opec (the renderer the coturn unit uses)
        run: cargo build -p opec --release --locked
      - name: Build static coturn
        run: |
          set -euo pipefail
          . relay/coturn-static/version.env
          docker buildx build --target artifacts \
            --build-arg "COTURN_VERSION=${COTURN_VERSION}" \
            --build-arg "COTURN_SHA256=${COTURN_SHA256}" \
            --output type=local,dest=relay-out relay/coturn-static
          ! readelf -d relay-out/turnserver 2>/dev/null | grep -q NEEDED
          relay-out/turnserver --version
      - name: Smoke test
        env:
          RELAY_COTURN_BIN_DIR: ${{ github.workspace }}/relay-out
          OPEC: ${{ github.workspace }}/target/release/opec
          RELAY_SMOKE_REQUIRE_IPV6: "1"
          RELAY_SMOKE_LEGACY: "1"
        run: bash tests/test_relay_coturn_smoke.sh
